<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Manager - Sistema Profesional</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        html,
        body {
            overflow: hidden;
            height: 100vh;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background-image: url('public/backgroundImage.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            position: relative;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(30, 60, 114, 0.65) 0%, rgba(42, 82, 152, 0.65) 50%, rgba(126, 34, 206, 0.65) 100%);
            pointer-events: none;
        }

        body::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(138, 43, 226, 0.3) 0%, transparent 50%);
            pointer-events: none;
        }

        .index-wrapper {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .index-container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 60px 50px;
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.3),
                0 0 1px rgba(255, 255, 255, 0.5) inset;
            max-width: 520px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .logo {
            width: 80px;
            height: 80px;
            margin: 0 auto 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 36px;
            color: white;
            font-weight: 700;
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
        }

        .index-container h1 {
            color: #1a202c;
            font-size: 42px;
            font-weight: 700;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .index-container .subtitle {
            color: #4a5568;
            font-size: 18px;
            margin-bottom: 40px;
            font-weight: 400;
            line-height: 1.6;
        }

        .features {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 40px;
            text-align: left;
        }

        .feature-item {
            background: #f7fafc;
            padding: 16px;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            transition: all 0.3s ease;
        }

        .feature-item:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
            border-color: #667eea;
        }

        .feature-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .feature-title {
            color: #2d3748;
            font-weight: 600;
            font-size: 14px;
            margin: 0;
        }

        .index-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .index-btn {
            padding: 16px 32px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
            font-size: 16px;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .index-btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .index-btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.5);
        }

        .index-btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .index-btn-secondary:hover {
            background: #667eea;
            color: white;
            transform: translateY(-3px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .footer-text {
            margin-top: 32px;
            padding-top: 24px;
            border-top: 1px solid #e2e8f0;
            color: #718096;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .index-container {
                padding: 40px 30px;
            }

            .index-container h1 {
                font-size: 32px;
            }

            .features {
                grid-template-columns: 1fr;
            }

            .index-buttons {
                flex-direction: column;
            }

            .index-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="index-wrapper">
        <div class="index-container">
            <div class="logo">EM</div>
            <h1>Email Manager</h1>
            <p class="subtitle">Sistema Profesional de Gestión de Usuarios y Autenticación</p>

            <div class="features">
                <div class="feature-item">
                    <div class="feature-icon">🔐</div>
                    <p class="feature-title">Autenticación Segura</p>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">✉️</div>
                    <p class="feature-title">Gestión de Email</p>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">👤</div>
                    <p class="feature-title">Perfiles de Usuario</p>
                </div>
                <div class="feature-item">
                    <div class="feature-icon">🔒</div>
                    <p class="feature-title">Recuperación de Cuenta</p>
                </div>
            </div>

            <div class="index-buttons">
                <a href="views/Auth/login.html" class="index-btn index-btn-primary">Iniciar Sesión</a>
                <a href="views/Auth/register.html" class="index-btn index-btn-secondary">Registrarse</a>
            </div>

            <p class="footer-text">© 2026 Email Manager - Todos los derechos reservados</p>
        </div>
    </div>
</body>

</html>
