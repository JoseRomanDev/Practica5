<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <style>
        body {
            background-image: url('../../public/ForgetemailPassword.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(30, 60, 114, 0.85) 0%, rgba(42, 82, 152, 0.85) 50%, rgba(126, 34, 206, 0.85) 100%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Recuperar Contraseña</h1>

        <form action="../../src/Controllers/Auth/forgot_password.php" method="POST">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="Ingresa tu email" required>
            </div>

            <button type="submit">Solicitar Recuperación</button>
        </form>

        <div class="links">
            <p><a href="login.html">Volver al login</a></p>
        </div>
    </div>
</body>

</html>
