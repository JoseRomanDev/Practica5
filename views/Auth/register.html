<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
    <style>
        body {
            background-image: url('../../public/loginImage.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(135deg, rgba(30, 60, 114, 0.85) 0%, rgba(42, 82, 152, 0.85) 50%, rgba(126, 34, 206, 0.85) 100%);
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Registro</h1>

        <form action="../../src/Controllers/Auth/register.php" method="POST">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" name="username" placeholder="Tu usuario" required>
            </div>

            <div class="form-group">
                <label for="name">Nombre</label>
                <input type="text" id="name" name="name" placeholder="Tu nombre" required>
            </div>

            <div class="form-group">
                <label for="surname">Apellido</label>
                <input type="text" id="surname" name="surname" placeholder="Tu apellido" required>
            </div>

            <div class="form-group">
                <label for="genre">Género</label>
                <select id="genre" name="genre" required>
                    <option value="">Selecciona género</option>
                    <option value="M">Masculino</option>
                    <option value="F">Femenino</option>
                    <option value="O">Otro</option>
                </select>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" placeholder="tu@email.com" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" name="password" placeholder="Mínimo 8 caracteres" required>
            </div>

            <div class="form-group">
                <label for="password_confirm">Confirmar Contraseña</label>
                <input type="password" id="password_confirm" name="password_confirm" placeholder="Repite la contraseña"
                    required>
            </div>

            <button type="submit">Registrarse</button>
        </form>

        <div class="links">
            <p><a href="login.html">¿Ya tienes cuenta? Inicia sesión</a></p>
        </div>
    </div>
</body>

</html>
