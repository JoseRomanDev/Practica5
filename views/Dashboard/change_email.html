<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Email</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Cambiar Email</h1>
        
        <div class="alert alert-info" style="margin-bottom: 20px;">
            <strong>Nota:</strong> Se enviará un email de confirmación al nuevo email para validar el cambio.
        </div>
        
        <form action="../../src/Controllers/Dashboard/change_email.php" method="POST">
            <div class="form-group">
                <label for="new_email">Nuevo Email</label>
                <input type="email" id="new_email" name="new_email" placeholder="tu@nuevoemail.com" required>
            </div>
            
            <div class="form-group">
                <label for="password">Contraseña (para confirmación)</label>
                <input type="password" id="password" name="password" placeholder="Tu contraseña actual" required>
            </div>
            
            <button type="submit">Solicitar Cambio</button>
            <a href="dashboard.html" style="display:block; text-align:center; margin-top:15px;">Volver</a>
        </form>
    </div>
</body>
</html>
