<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cambiar Contraseña</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Cambiar Contraseña</h1>
        
        <form action="../../src/Controllers/Dashboard/change_password.php" method="POST">
            <div class="form-group">
                <label for="current_password">Contraseña Actual</label>
                <input type="password" id="current_password" name="current_password" placeholder="Tu contraseña actual" required>
            </div>
            
            <div class="form-group">
                <label for="new_password">Nueva Contraseña</label>
                <input type="password" id="new_password" name="new_password" placeholder="Mínimo 8 caracteres" required>
            </div>
            
            <div class="form-group">
                <label for="confirm_password">Confirmar Contraseña</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Repite la contraseña" required>
            </div>
            
            <button type="submit">Actualizar Contraseña</button>
            <a href="dashboard.html" style="display:block; text-align:center; margin-top:15px;">Volver</a>
        </form>
    </div>
</body>
</html>
