<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil</title>
    <link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
    <div class="container">
        <h1>Editar Perfil</h1>
        
        <form action="../../src/Controllers/Dashboard/edit_profile.php" method="POST">
            <div class="form-group">
                <label for="name">Nombre</label>
                <input type="text" id="name" name="name" placeholder="Tu nombre" required>
            </div>
            
            <div class="form-group">
                <label for="surname">Apellido</label>
                <input type="text" id="surname" name="surname" placeholder="Tu apellido" required>
            </div>
            
            <div class="form-group">
                <label for="genre">Género</label>
                <select id="genre" name="genre" required>
                    <option value="M">Masculino</option>
                    <option value="F">Femenino</option>
                    <option value="O">Otro</option>
                </select>
            </div>
            
            <button type="submit">Actualizar Perfil</button>
            <a href="dashboard.html" style="display:block; text-align:center; margin-top:15px;">Volver</a>
        </form>
    </div>
</body>
</html>
